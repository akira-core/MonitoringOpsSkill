# Lab dashboards, picked up by the Grafana dashboard sidecar (label grafana_dashboard=1).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Lab
configMapGenerator:
  - name: dashboard-vmagent-autoscale-lab
    files:
      - vmagent-autoscale-lab.json
  - name: dashboard-k8s-logs-clickhouse
    files:
      - k8s-logs-clickhouse.json
  - name: dashboard-vector-autoscale-lab
    files:
      - vector-autoscale-lab.json
  - name: dashboard-scaledown-verify
    files:
      - scaledown-verify.json
  # Vendored upstream dashboards (sources, licences and changes: upstream/SOURCES.md)
  - name: dashboard-vm-alert-statistics
    options:
      annotations:
        grafana_folder: VictoriaMetrics
    files:
      - upstream/vm-alert-statistics.json
  - name: dashboard-kubernetes-autoscaling-hpa
    options:
      annotations:
        grafana_folder: Kubernetes
    files:
      - upstream/kubernetes-autoscaling-hpa.json
  - name: dashboard-kubernetes-autoscaling-pdb
    options:
      annotations:
        grafana_folder: Kubernetes
    files:
      - upstream/kubernetes-autoscaling-pdb.json
  - name: dashboard-otel-logs-explorer
    options:
      annotations:
        grafana_folder: Logs
    files:
      - upstream/otel-logs-explorer.json
