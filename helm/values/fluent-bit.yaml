# fluent-bit DaemonSet: tail pod logs -> enrich with k8s metadata -> OTLP/HTTP -> Vector aggregator
# (disk buffer on PVC) -> rotel -> ClickHouse
# Record shape after filters (becomes LogAttributes in otel.otel_logs):
#   log                -> OTLP Body (logs_body_key)
#   k8s.namespace.name, k8s.pod.name, k8s.pod.uid, k8s.container.name,
#   k8s.node.name, container.image.name, log.iostream  -> attributes
resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { memory: 256Mi }

# The chart's own dashboard, picked up by the Grafana sidecar (label grafana_dashboard=1, all namespaces).
dashboards:
  enabled: true
  labelValue: "1"
  annotations:
    grafana_folder: Logs
  deterministicUid: true

config:
  inputs: |
    [INPUT]
        Name              tail
        Path              /var/log/containers/*.log
        Exclude_Path      /var/log/containers/fluent-bit-*_logging_*.log
        multiline.parser  cri, docker
        Tag               kube.*
        Mem_Buf_Limit     16MB
        Skip_Long_Lines   On
        Refresh_Interval  5

  filters: |
    [FILTER]
        Name                 kubernetes
        Match                kube.*
        Merge_Log            Off
        Keep_Log             On
        Labels               Off
        Annotations          Off
        K8S-Logging.Parser   On
        K8S-Logging.Exclude  On

    [FILTER]
        Name          nest
        Match         kube.*
        Operation     lift
        Nested_under  kubernetes
        Add_prefix    k8s_

    [FILTER]
        Name    modify
        Match   kube.*
        Rename  k8s_namespace_name   k8s.namespace.name
        Rename  k8s_pod_name         k8s.pod.name
        Rename  k8s_pod_id           k8s.pod.uid
        Rename  k8s_container_name   k8s.container.name
        Rename  k8s_container_image  container.image.name
        Rename  k8s_host             k8s.node.name
        Rename  stream               log.iostream
        Remove  k8s_docker_id
        Remove  k8s_container_hash
        Remove  k8s_pod_ip
        Remove  _p
        Remove  time

  outputs: |
    [OUTPUT]
        Name                      opentelemetry
        Match                     kube.*
        Host                      vector.logging.svc.cluster.local
        Port                      4318
        Logs_uri                  /v1/logs
        Tls                       Off
        logs_body_key             $log
        logs_body_key_attributes  true
        Retry_Limit               no_limits
        # Spread load over Vector pods: several workers, each recycling its keep-alive connection
        # (kube-proxy balances per connection, so long-lived connections would pin one pod).
        Workers                   4
        net.keepalive             on
        net.keepalive_max_recycle 20
