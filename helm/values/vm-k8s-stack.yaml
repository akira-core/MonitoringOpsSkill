# ---------------------------------------------------------------------------
# Grafana: VictoriaMetrics (cluster/vmselect) + ClickHouse (otel logs)
# ---------------------------------------------------------------------------
defaultDatasources:
  extra:
    - name: ClickHouse
      uid: ClickHouse
      type: grafana-clickhouse-datasource
      access: proxy
      editable: false
      jsonData:
        host: clickhouse-logs.clickhouse.svc.cluster.local
        port: 8123
        protocol: http
        username: grafana   # read-only ClickHouse user (manifests/clickhouse/chi.yaml)
        defaultDatabase: otel
        logs:
          defaultDatabase: otel
          defaultTable: otel_logs
          otelEnabled: true
          otelVersion: latest
      secureJsonData:
        # Expanded by Grafana from the container env (see grafana.envValueFrom).
        password: ${CLICKHOUSE_GRAFANA_PASSWORD}

grafana:
  enabled: true
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  plugins:
    - victoriametrics-metrics-datasource
    - grafana-clickhouse-datasource
  envValueFrom:
    CLICKHOUSE_GRAFANA_PASSWORD:
      secretKeyRef:
        name: clickhouse-grafana
        key: password
  persistence:
    enabled: false
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true
  # 512Mi OOM-killed Grafana 13 (plus the ClickHouse/VM backend plugin processes) when it opened
  # the 27-panel scaledown-verify dashboard; 1Gi still restarted under parallel panel queries.
  # The skill also throttles its own API calls (monitoring-operator, "Request budget").
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { memory: 2Gi }
