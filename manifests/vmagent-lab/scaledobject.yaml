# KEDA scales VMAgent/lab through its /scale subresource (= spec.shardCount).
# Load signal: samples/s scraped by all lab shards, read back from VictoriaMetrics (vmselect).
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: vmagent-lab
  namespace: vmagent-lab
spec:
  scaleTargetRef:
    apiVersion: operator.victoriametrics.com/v1beta1
    kind: VMAgent
    name: lab
  minReplicaCount: 2      # never cross into non-sharded mode (shardCount <= 1)
  maxReplicaCount: 5
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 30
          policies:
            - { type: Pods, value: 1, periodSeconds: 60 }
        scaleDown:
          stabilizationWindowSeconds: 120
          policies:
            - { type: Pods, value: 1, periodSeconds: 120 }
  triggers:
    - type: prometheus
      metricType: AverageValue
      metadata:
        serverAddress: http://vmselect-vmks.monitoring.svc.cluster.local:8481/select/0/prometheus
        # Count only replica 0 of each shard: both replicas scrape the same targets, so summing
        # every pod would double the load signal (and the shard count).
        query: sum(rate(vm_promscrape_scraped_samples_sum{namespace="vmagent-lab", pod=~"vmagent-lab-[0-9]+-0"}[1m]))
        threshold: "2000"   # samples/s per shard
