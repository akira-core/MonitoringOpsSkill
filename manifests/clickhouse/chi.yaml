# Single-shard, single-replica ClickHouse for k8s logs (no Keeper needed).
# The `otel` user password comes from Secret clickhouse/clickhouse-otel (created by scripts/up.sh).
# operator >= 0.27.4: secrets only via valueFrom.secretKeyRef (k8s_secret_* syntax removed).
apiVersion: clickhouse.altinity.com/v1
kind: ClickHouseInstallation
metadata:
  name: logs
  namespace: clickhouse
spec:
  defaults:
    templates:
      podTemplate: clickhouse
      dataVolumeClaimTemplate: data
  configuration:
    users:
      otel/password:
        valueFrom:
          secretKeyRef:
            name: clickhouse-otel
            key: password
      otel/networks/ip:
        - "::/0"
      otel/profile: default
      otel/access_management: 0
    clusters:
      - name: logs
        layout:
          shardsCount: 1
          replicasCount: 1
  templates:
    podTemplates:
      - name: clickhouse
        spec:
          containers:
            - name: clickhouse
              image: clickhouse/clickhouse-server:25.8
              resources:
                requests: { cpu: 200m, memory: 512Mi }
                limits: { memory: 2Gi }
    volumeClaimTemplates:
      - name: data
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 5Gi
