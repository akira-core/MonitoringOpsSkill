# rotel: lightweight OTLP collector; receives OTLP/HTTP logs from fluent-bit
# and writes them to ClickHouse table otel.otel_logs.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rotel
  namespace: logging
  labels: { app.kubernetes.io/name: rotel }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: rotel }
  template:
    metadata:
      labels: { app.kubernetes.io/name: rotel }
    spec:
      containers:
        - name: rotel
          image: streamfold/rotel:latest
          command: ["/rotel", "start"]
          args:
            - --otlp-grpc-endpoint=0.0.0.0:4317
            - --otlp-http-endpoint=0.0.0.0:4318
            - --exporter=clickhouse
          env:
            - name: ROTEL_CLICKHOUSE_EXPORTER_ENDPOINT
              value: http://clickhouse-logs.clickhouse.svc.cluster.local:8123
            - name: ROTEL_CLICKHOUSE_EXPORTER_DATABASE
              value: otel
            - name: ROTEL_CLICKHOUSE_EXPORTER_USER
              value: otel
            - name: ROTEL_CLICKHOUSE_EXPORTER_PASSWORD
              valueFrom:
                secretKeyRef: { name: clickhouse-otel, key: password }
          ports:
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: otlp-http, containerPort: 4318 }
          readinessProbe:
            tcpSocket: { port: otlp-http }
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: rotel
  namespace: logging
  labels: { app.kubernetes.io/name: rotel }
spec:
  selector: { app.kubernetes.io/name: rotel }
  ports:
    - { name: otlp-grpc, port: 4317, targetPort: otlp-grpc }
    - { name: otlp-http, port: 4318, targetPort: otlp-http }
